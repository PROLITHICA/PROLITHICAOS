services:
  - type: web
    name: prolithica-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn prolithica.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: PROLITHICA_SECRET_KEY
        generateValue: true
      - key: PROLITHICA_DEBUG
        value: "0"
      - key: PROLITHICA_ALLOWED_HOSTS
        value: ".onrender.com,.prolithica.com"
      - key: DATABASE_URL
        fromDatabase:
          name: prolithica-db
          property: connectionString
      - key: PROLITHICA_CORS_ORIGINS
        sync: false   # set manually: https://www.prolithica.com
      - key: PROLITHICA_TRUSTED_ORIGINS
        sync: false   # set manually: https://www.prolithica.com

databases:
  - name: prolithica-db
    plan: free
